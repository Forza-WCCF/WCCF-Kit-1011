[package]
name = "wccf-kit-launcher"
version = "5.5.0"
edition = "2024"
rust-version = "1.99"
description = "PLAY and SETUP.exe: the WCCF 2010-11 kit's launchers"
publish = false

[lib]
name = "launcher"
path = "src/lib.rs"

[[bin]]
name = "PLAY"
path = "src/bin/play.rs"

[[bin]]
name = "SETUP"
path = "src/bin/setup/main.rs"

[dependencies]
serde_json = "1.0.151"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
